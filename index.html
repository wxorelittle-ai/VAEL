<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAEL — Центр управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* VAEL brand — warm muted palette: gold accent (hue 82) + terracotta (45) */
    --accent-h: 82;
    --accent-h2: 45;
    /* Neutrals — warm dark (void · abyss · surface · panel · border) */
    --bg-0: #12100B;
    --bg-1: #1A1610;
    --bg-2: #221D15;
    --bg-3: #2C261C;
    --line: #3A3226;
    --line-bright: #4C4234;
    --text-dim: #6E6350;
    --text-mid: #8C8170;
    --text: #C6BBA6;
    --text-bright: #F1EADB;
    --accent: oklch(0.76 0.11 var(--accent-h));
    --accent-soft: oklch(0.76 0.11 var(--accent-h) / 0.14);
    --accent-dim: oklch(0.60 0.10 var(--accent-h));
    --accent-2: oklch(0.66 0.12 var(--accent-h2));
    --green: #86B08A;
    --amber: #E0B24C;
    --red:   #CC7357;
    --blue:  #8FA6B8;
    --pad: 12px; --pad-sm: 8px; --gap: 10px;
    --radius: 5px; --radius-lg: 8px;
    --font-ui: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
    --glow: 0 0 0 1px oklch(0.76 0.11 var(--accent-h) / 0.3);
    --glow-strong: 0 0 0 1px oklch(0.76 0.11 var(--accent-h) / 0.42), 0 0 16px -6px oklch(0.76 0.11 var(--accent-h) / 0.32);
    --speed: 1;
  }
  [data-glow="off"] { --glow: 0 0 0 1px oklch(0.78 0.16 var(--accent-h) / 0.4); --glow-strong: 0 0 0 1px oklch(0.78 0.16 var(--accent-h) / 0.6); }
  [data-density="compact"] { --pad: 8px; --pad-sm: 6px; --gap: 6px; }
  [data-density="spacious"] { --pad: 16px; --pad-sm: 12px; --gap: 14px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--text); font-family: var(--font-ui); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; }
  body { background: radial-gradient(ellipse 80% 60% at 20% 10%, oklch(0.78 0.16 var(--accent-h) / 0.04), transparent 60%), radial-gradient(ellipse 70% 50% at 90% 90%, oklch(0.72 0.18 var(--accent-h2) / 0.05), transparent 60%), var(--bg-0); }
  .panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; position: relative; }
  .panel-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mid); min-height: 28px; }
  .panel-header .ph-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .panel-header .ph-title { color: var(--text-bright); }
  .panel-header .ph-meta { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); font-weight: 400; letter-spacing: 0; }
  .mono { font-family: var(--font-mono); }
  .dim { color: var(--text-dim); } .mid { color: var(--text-mid); } .bright { color: var(--text-bright); }
  .accent { color: var(--accent); } .green { color: var(--green); } .amber { color: var(--amber); } .red { color: var(--red); } .blue { color: var(--blue); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 3px; background: var(--bg-3); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; color: var(--text-mid); letter-spacing: 0.04em; }
  .chip-accent { color: var(--accent); border-color: oklch(0.78 0.16 var(--accent-h) / 0.4); background: var(--accent-soft); }
  .chip-green { color: var(--green); border-color: oklch(0.72 0.10 150 / 0.4); background: oklch(0.72 0.10 150 / 0.10); }
  .chip-amber { color: var(--amber); border-color: oklch(0.82 0.16 75 / 0.4); background: oklch(0.82 0.16 75 / 0.10); }
  .chip-red { color: var(--red); border-color: oklch(0.65 0.13 35 / 0.4); background: oklch(0.65 0.13 35 / 0.10); }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; }
  .pulse { position: relative; }
  .pulse::before { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: currentColor; opacity: 0.4; animation: pulse calc(1.6s / var(--speed)) ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(2.6); opacity: 0; } }
  .scroll { overflow-y: auto; overflow-x: hidden; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 3px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: var(--line-bright); }
  .grid-bg { background-image: linear-gradient(to right, oklch(0.78 0.16 var(--accent-h) / 0.025) 1px, transparent 1px), linear-gradient(to bottom, oklch(0.78 0.16 var(--accent-h) / 0.025) 1px, transparent 1px); background-size: 24px 24px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text-mid); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; border-radius: 3px; cursor: pointer; transition: all 0.12s; }
  .btn:hover { background: var(--bg-3); color: var(--text-bright); border-color: var(--line-bright); }
  .btn-accent { color: var(--accent); border-color: oklch(0.78 0.16 var(--accent-h) / 0.5); background: var(--accent-soft); }
  .btn-accent:hover { color: var(--text-bright); background: oklch(0.78 0.16 var(--accent-h) / 0.2); box-shadow: var(--glow); }
  #boot { position: fixed; inset: 0; background: var(--bg-0); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--accent); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; z-index: 10000; }
  #boot.gone { display: none; }
  .boot-bar { width: 200px; height: 2px; background: var(--bg-2); overflow: hidden; position: relative; }
  .boot-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, transparent, var(--accent), transparent); animation: bootSlide 1.2s linear infinite; }
  @keyframes bootSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
</style>
</head>
<body>

<div id="boot">
  <svg width="52" height="52" viewBox="0 0 64 64" fill="none" style="margin-bottom:4px;">
    <polygon points="32,6 54,19 54,45 32,58 10,45 10,19" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.4"></polygon>
    <polygon points="32,14 47,22.5 47,41.5 32,50 17,41.5 17,22.5" fill="none" stroke="var(--accent)" stroke-width="1.3" opacity="0.8"></polygon>
    <circle cx="32" cy="32" r="5" fill="var(--accent)"></circle>
    <circle cx="32" cy="32" r="9" fill="var(--accent)" opacity="0.15"></circle>
    <circle cx="32" cy="14" r="2.2" fill="var(--accent-2)"></circle><circle cx="47" cy="22.5" r="2.2" fill="var(--accent-2)"></circle>
    <circle cx="47" cy="41.5" r="2.2" fill="var(--accent-2)"></circle><circle cx="32" cy="50" r="2.2" fill="var(--accent-2)"></circle>
    <circle cx="17" cy="41.5" r="2.2" fill="var(--accent-2)"></circle><circle cx="17" cy="22.5" r="2.2" fill="var(--accent-2)"></circle>
    <line x1="32" y1="32" x2="32" y2="14" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
    <line x1="32" y1="32" x2="47" y2="22.5" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
    <line x1="32" y1="32" x2="47" y2="41.5" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
    <line x1="32" y1="32" x2="32" y2="50" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
    <line x1="32" y1="32" x2="17" y2="41.5" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
    <line x1="32" y1="32" x2="17" y2="22.5" stroke="var(--accent)" stroke-width="0.9" opacity="0.5"></line>
  </svg>
  <div style="font-size:16px; font-weight:700; letter-spacing:0.28em; color:var(--text-bright);">VAEL</div>
  <div class="boot-bar"></div>
  <div style="opacity: 0.5">AGENT NETWORK · ИНИЦИАЛИЗАЦИЯ · v6.2.41</div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Script loader: injects all modules with a per-load cache-busting token so
     edits are always picked up on reload (no-build in-browser Babel setup).
     Runs synchronously during parse → tags exist before Babel's DOMContentLoaded pass. -->
<script>
  (function () {
    var modules = [
      "tweaks-panel", "widgets", "bybit", "signals", "layout", "dashboard", "crypto",
      "pages", "extras", "notifications", "tools", "news", "alert-rules",
      "strategy-studio", "agent-live", "scenarios", "memory-graph",
      "opportunities", "copilot", "portfolio", "smart-money", "actions",
      "analyst", "airdrops", "assistant", "pair-trading", "daily-agent", "brain", "trade-plan", "app",
    ];
    var token = Date.now();
    modules.forEach(function (name) {
      var s = document.createElement("script");
      s.type = "text/babel";
      s.src = name + ".jsx?v=" + token;
      document.currentScript.parentNode.insertBefore(s, document.currentScript);
    });
  })();
</script>

<script>
  window.addEventListener("load", () => {
    setTimeout(() => {
      const el = document.getElementById("boot");
      if (el) el.classList.add("gone");
    }, 900);
  });
</script>
</body>
</html>
